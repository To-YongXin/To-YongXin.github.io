<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - To YongXin</title>
    <link rel="stylesheet" href="assets/css/menu.css">

    <div class="menu-container">

      "chapters": [

        { "number": "四", "title": "为你千万遍", "path": "chapters/04-for-you/", "enabled": true },
        { "number": "五", "title": "多远都要在一起", "path": "chapters/05-together/", "enabled": true },
        { "number": "六", "title": "此刻最好的都在身边", "path": "chapters/06-disneyland/", "enabled": true }
      ]
    }
    </script>

    <script src="assets/js/menu.js"></script>

</html>
